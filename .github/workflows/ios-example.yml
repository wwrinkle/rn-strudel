# Builds the example app for a real iPhone, unsigned, as an .ipa artifact. Sign and install it yourself (e.g. with
# Sideloader or AltStore). Built with EXPO_PUBLIC_AUTORUN=1 by default: the app tests every row on launch and logs
# `[STRUDEL]` lines (read them with e.g. `pymobiledevice3 syslog live`).
name: iOS example build

on:
  workflow_dispatch:
    inputs:
      autorun:
        description: Test every row on launch
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      # The example uses rn-web-audio-compat from a sibling checkout.
      - uses: actions/checkout@v4
        with:
          path: rn-strudel
      - uses: actions/checkout@v4
        with:
          repository: wwrinkle/rn-web-audio-compat
          path: rn-web-audio-compat

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: rn-strudel/example
        run: npm ci

      - name: Generate the iOS project
        working-directory: rn-strudel/example
        run: npx expo prebuild -p ios --no-install

      - name: Install CocoaPods
        working-directory: rn-strudel/example/ios
        run: pod install

      - name: Build (unsigned, device)
        working-directory: rn-strudel/example/ios
        env:
          EXPO_PUBLIC_AUTORUN: ${{ inputs.autorun && '1' || '' }}
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" -scheme "${WORKSPACE%.xcworkspace}" -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build | tail -200

      - name: Package .ipa
        working-directory: rn-strudel/example/ios
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -n1)
          mkdir -p Payload && cp -R "$APP" Payload/ && zip -qr $GITHUB_WORKSPACE/example-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: example-unsigned-ipa
          path: example-unsigned.ipa
          retention-days: 14
